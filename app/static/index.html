<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khanh Voice — Tạo giọng nói miễn phí</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #eef0f4;
    --muted: #9aa1af;
    --accent: #6c8cff;
    --accent-hover: #8aa4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  textarea, select {
    width: 100%;
    background: #10131a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea {
    resize: vertical;
    min-height: 120px;
  }
  .row {
    display: flex;
    gap: 16px;
  }
  .row > div { flex: 1; }
  .row-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
  }
  input[type="range"] { width: 100%; }
  button {
    margin-top: 22px;
    width: 100%;
    background: var(--accent);
    color: #0b0d12;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .result { margin-top: 18px; display: none; }
  audio { width: 100%; margin-top: 10px; }
  a.download {
    display: inline-block;
    margin-top: 10px;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
  }
  .error {
    margin-top: 14px;
    color: #ff8080;
    font-size: 14px;
    display: none;
  }
  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎙️ Khanh Voice — Tạo giọng nói miễn phí</h1>
    <p class="subtitle">Chuyển văn bản thành giọng nói bằng Microsoft Edge Neural TTS — hoàn toàn miễn phí, không cần API key.</p>

    <label for="text">Văn bản</label>
    <textarea id="text" placeholder="Nhập nội dung cần đọc..." maxlength="5000"></textarea>

    <label for="voice">Giọng đọc</label>
    <select id="voice"></select>

    <div class="row">
      <div>
        <div class="row-labels"><span>Tốc độ</span><span id="rateVal">0%</span></div>
        <input type="range" id="rate" min="-50" max="50" value="0" />
      </div>
      <div>
        <div class="row-labels"><span>Cao độ</span><span id="pitchVal">0Hz</span></div>
        <input type="range" id="pitch" min="-50" max="50" value="0" />
      </div>
    </div>

    <button id="generate">Tạo giọng nói</button>
    <div class="error" id="error"></div>

    <div class="result" id="result">
      <audio id="player" controls></audio>
      <br />
      <a class="download" id="download" download="giong-noi.mp3">⬇ Tải file MP3</a>
    </div>

    <div class="footer">Sử dụng giọng Neural miễn phí của Microsoft Edge — phù hợp podcast, video, học tập.</div>
  </div>

<script>
  const voiceSelect = document.getElementById("voice");
  const textEl = document.getElementById("text");
  const rateEl = document.getElementById("rate");
  const pitchEl = document.getElementById("pitch");
  const rateVal = document.getElementById("rateVal");
  const pitchVal = document.getElementById("pitchVal");
  const generateBtn = document.getElementById("generate");
  const errorEl = document.getElementById("error");
  const resultEl = document.getElementById("result");
  const player = document.getElementById("player");
  const downloadLink = document.getElementById("download");

  let currentUrl = null;

  fetch("/api/voices")
    .then((r) => r.json())
    .then((voices) => {
      voiceSelect.innerHTML = voices
        .map((v) => `<option value="${v.id}">${v.label}</option>`)
        .join("");
    });

  rateEl.addEventListener("input", () => {
    rateVal.textContent = `${rateEl.value > 0 ? "+" : ""}${rateEl.value}%`;
  });
  pitchEl.addEventListener("input", () => {
    pitchVal.textContent = `${pitchEl.value > 0 ? "+" : ""}${pitchEl.value}Hz`;
  });

  generateBtn.addEventListener("click", async () => {
    const text = textEl.value.trim();
    errorEl.style.display = "none";
    if (!text) {
      errorEl.textContent = "Vui lòng nhập văn bản.";
      errorEl.style.display = "block";
      return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = "Đang tạo...";

    try {
      const res = await fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          voice: voiceSelect.value,
          rate: Number(rateEl.value),
          pitch: Number(pitchEl.value),
        }),
      });

      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.detail || "Không thể tạo giọng nói.");
      }

      const blob = await res.blob();
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(blob);

      player.src = currentUrl;
      downloadLink.href = currentUrl;
      resultEl.style.display = "block";
      player.play();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = "Tạo giọng nói";
    }
  });
</script>
</body>
</html>
